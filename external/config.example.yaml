# Copy to external/config.yaml, or skip this file and pass --root.

workspace_root: ~/Documents/my-notes

# sqlite is the default. The index is a file in the folder you index.
# No Firebase account.
store: sqlite

embedding_model: nomic-embed-text
chunk_size: 500
chunk_overlap: 50

indexed_extensions:
  - .md
  - .txt

excluded_dirs:
  - node_modules
  - .git
  - .venv
  - __pycache__
  - .workspace-rag

# Optional cloud index. Only if you already run Firebase:
# store: firestore
# firestore_collection: workspace_rag_external
